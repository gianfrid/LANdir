version: 2
updates:
  # Containerfile FROM lines: keeps tag AND digest in sync (docker ecosystem
  # updates digest-pinned images automatically).
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  # Rust crate dependencies (Cargo.toml / Cargo.lock).
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
