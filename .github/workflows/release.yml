# On a v* tag: build the release APK and attach it to a GitHub Release, so
# it is publicly downloadable without a login (run artifacts expire and are
# login-walled). alpha/beta/rc tags become prereleases; anything else is a
# full release.
#
# Tag builds are signed with the release key (secrets ANDROID_KEYSTORE_*);
# a missing secret fails the build rather than silently publishing a
# debug-signed APK.
#
# The build steps are duplicated in rolling.yml on purpose: extracting a
# reusable workflow for five steps is not worth the indirection. If the
# build changes, change it in both places.
name: Release

on:
  push:
    tags: ["v*"]
  # Manual runs against a tag ref backfill its release with a fresh build
  # (e.g. gh workflow run release.yml --ref v1.0.0-alpha).
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the APK
  packages: write # push the container image to ghcr.io

jobs:
  # Build the Containerfile and publish it to the GitHub Container Registry
  # on v* tags, so users can `podman pull ghcr.io/gianfrid/landir` instead
  # of building locally. Runs on tags only; manual dispatch on a branch
  # builds nothing (there is no meaningful tag to publish).
  container:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout
      packages: write # ghcr.io push
    steps:
      - uses: actions/checkout@v7

      # Register binfmt handlers so the arm64 build leg can run under qemu.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch (amd64 + arm64) manifest list; the Containerfile maps
      # TARGETARCH to the right musl target. docker buildx handles ghcr's
      # blob-existence probes correctly (podman push fails with 403 on the
      # first push to a fresh package).
      - name: Build and push container image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/landir
          TAG: ${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 -f Containerfile \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" --push .

      # First push creates the package private by default even in a public
      # repo; flip it to public so the image is anonymously pullable.
      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH \
          "/repos/${{ github.repository }}/packages/container/landir/visibility" \
          -f visibility=public

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Fetch packages
        working-directory: app
        run: flutter pub get

      # Fail before building if any signing secret is missing: a tag build
      # must never silently fall back to the debug key.
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!s:-}" ]; then echo "missing secret: $s" >&2; exit 1; fi
          done

      - name: Decode release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release-key.jks
          echo "ANDROID_KEYSTORE_FILE=/tmp/release-key.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      # Same build as scripts/build-apk.sh, but signed with the release key
      # (build.gradle.kts reads ANDROID_KEYSTORE_FILE et al.).
      - name: Build APK (arm64)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app
        run: flutter build apk --release --split-per-abi --target-platform=android-arm64

      # Tag refs only: a manual dispatch on a branch must build and upload
      # the run artifact without creating a release named after the branch.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          APK=app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          flags=()
          if [[ "$TAG" =~ (alpha|beta|rc) ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" --generate-notes "$APK" \
            || gh release upload "$TAG" "$APK" --clobber
