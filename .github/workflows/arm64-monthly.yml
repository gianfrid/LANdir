# Monthly arm64 container image. The rolling amd64 image is built on every
# push by rolling.yml; this job keeps an arm64 build available as
# ghcr.io/<owner>/landir:arm64 without paying the qemu build cost on every
# push. Scheduled only — not run on push/PR.
name: arm64 image (monthly)

on:
  schedule:
    - cron: "0 0 1 * *" # 00:00 UTC on the 1st of each month

permissions:
  contents: read # checkout
  packages: write # ghcr.io push

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The arm64 build leg runs under qemu on the amd64 runner.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Prefer a PAT (secret GHCR_TOKEN, scopes read:packages + write:packages);
      # the default GITHUB_TOKEN can be denied (read_package) when the ghcr
      # namespace has an unlinked package. Falls back to GITHUB_TOKEN.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/landir
        run: |
          docker buildx build --platform linux/arm64 -f Containerfile \
            -t "$IMAGE:arm64" --push .

      # The package was pushed with the PAT, so the visibility PATCH must use
      # the same token — GITHUB_TOKEN gets 404 on PAT-created packages.
      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          # PAT-pushed packages live under the user namespace and may not be
          # linked to the repo, so the repo-scoped endpoint can 404 — fall
          # back to the user-scoped one.
          gh api --method PATCH \
            "/repos/${{ github.repository }}/packages/container/landir/visibility" \
            -f visibility=public \
          || gh api --method PATCH \
            "/user/packages/container/landir/visibility" \
            -f visibility=public
