name: CI

on:
  push:
    branches: [slop]
  pull_request:
    branches: [slop]

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        # landir.py must keep running on a bare old python3 (README claims
        # 3.7+); 3.9 is the oldest prebuilt on the current runner images.
        # Newer-syntax regressions (walrus, match, removeprefix, …) fail here.
        python-version: ["3.9", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python tests
        run: python3 -m unittest discover -s tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Rust tests
        run: cargo test --locked

      - name: cargo audit (RustSec advisories)
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

      - name: SBOM is up to date
        # cargo-sbom output ordering is non-deterministic; compare normalized
        # package sets. The sort key must include versionInfo: the lock graph
        # legitimately contains several versions of one crate (e.g. two
        # windows-sys), and sort_by(.name) alone leaves those entries in
        # cargo-sbom's arbitrary input order, producing spurious diffs.
        run: |
          cargo install cargo-sbom --locked --quiet
          norm() { jq -S '[.packages[] | {name, versionInfo, licenseConcluded}] | sort_by(.name, .versionInfo)'; }
          cargo sbom 2>/dev/null | norm > /tmp/sbom-new.json
          norm < SBOM.spdx.json > /tmp/sbom-old.json
          diff /tmp/sbom-old.json /tmp/sbom-new.json

  # The pub bumps and the app itself need a Flutter gate: matching the
  # SDK Rolling builds the APK with means a pubspec that cannot resolve
  # (e.g. a test/build_runner version above flutter_test's ceiling) fails
  # here instead of after the merge.
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Fetch packages
        run: flutter pub get

      - name: Static analysis
        # Pre-existing lint infos (avoid_print in tool/, two build-context
        # warnings in file_browser_view) stay non-fatal; errors fail.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: App tests
        run: flutter test

# The container image build + smoke test lives in rolling.yml (it publishes
# the amd64 image on every push); arm64 is built by the monthly scheduled
# workflow arm64-monthly.yml.
