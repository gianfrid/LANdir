# Rolling builds: on every push to slop, build the signed APK, the Linux
# AppImage and the container image and publish them under fixed, replaceable
# names so the previous rolling build is superseded:
#
#   - APK: attached to the persistent "rolling" GitHub Release as
#     landir-arm64.apk (asset clobbered on each run). Obtanium pointed at
#     this repo picks it up as the latest (non-prerelease) release.
#   - AppImage: attached to the same rolling release as
#     landir-x86_64.AppImage (asset clobbered on each run).
#   - Image: pushed to ghcr.io/<owner>/landir:latest and :rolling, so
#     `podman pull ghcr.io/gianfrid/landir:latest` always gets the newest
#     build.
#
# Versioned v* tags still go through release.yml (signed APK and AppImage on
# a versioned release); this workflow only handles the rolling channel. The
# APK build mirrors release.yml on purpose, including the
# fail-fast secrets check: a rolling build must never silently fall back to
# a debug-signed APK that users would install over the signed one. The
# AppImage is built by the shared scripts/build-appimage.sh, which it has
# in common with release.yml, so the two channels cannot drift apart.
#
# Publish is gated on green suites: ci.yml runs concurrently on the same
# push but cannot gate a separate workflow, so the tests run here too —
# a red run must not ship an APK to Obtanium auto-updaters or move :latest.
name: Rolling

on:
  push:
    branches: [slop]
  workflow_dispatch:

permissions:
  contents: write # move the rolling tag, create/update the release
  packages: write # push the rolling image to ghcr.io

concurrency:
  # One rolling pipeline at a time: the apk/appimage jobs force-push the
  # `rolling` tag and clobber the same release assets, so overlapping runs
  # could interleave artifacts from different commits. A newer push
  # supersedes the older run entirely.
  group: rolling
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Python tests
        run: python3 -m unittest discover -s tests

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Rust tests
        run: cargo test --locked

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true
      - name: Fetch packages
        working-directory: app
        run: flutter pub get
      - name: App tests
        working-directory: app
        run: flutter test

  apk:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Fetch packages
        working-directory: app
        run: flutter pub get

      # Fail before building if any signing secret is missing (same rule as
      # release.yml).
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!s:-}" ]; then echo "missing secret: $s" >&2; exit 1; fi
          done

      - name: Decode release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release-key.jks
          echo "ANDROID_KEYSTORE_FILE=/tmp/release-key.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK (arm64, release-signed)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app
        run: flutter build apk --release --split-per-abi --target-platform=android-arm64

      - name: Publish rolling APK to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          cp "$APK" /tmp/landir-arm64.apk
          # Keep the rolling release pointing at the commit being built.
          # actions/checkout persists the GITHUB_TOKEN credentials, so this
          # push is authorized by contents: write above.
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f rolling HEAD
          git push --force origin rolling
          if gh release view rolling >/dev/null 2>&1; then
            gh release upload rolling /tmp/landir-arm64.apk --clobber
          else
            gh release create rolling --title "Rolling build (latest)" \
              --notes "Automated rolling build of the \`slop\` branch. The APK and AppImage assets are replaced on every push; versioned releases live under the v* tags." \
              /tmp/landir-arm64.apk
          fi

  # Linux desktop AppImage for the rolling channel. The build recipe lives
  # in scripts/build-appimage.sh, shared with release.yml — same factoring
  # as the APK: one tested recipe, each workflow owns its publish steps.
  appimage:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Flutter's Linux runner links GTK3; the headers and ninja are not on
      # the runner image (clang/cmake/pkg-config are).
      - name: Linux desktop build deps
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.50.1
          channel: stable
          cache: true

      - name: Build AppImage
        run: scripts/build-appimage.sh

      - name: Publish rolling AppImage to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp landir-x86_64.AppImage /tmp/landir-x86_64.AppImage
          # Keep the rolling release pointing at the commit being built.
          # The apk job does the same move; both point at HEAD, so the
          # duplicate force-push is idempotent and keeps this job
          # self-contained if the apk job fails.
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f rolling HEAD
          git push --force origin rolling
          if gh release view rolling >/dev/null 2>&1; then
            gh release upload rolling /tmp/landir-x86_64.AppImage --clobber
          else
            gh release create rolling --title "Rolling build (latest)" \
              --notes "Automated rolling build of the \`slop\` branch. The APK and AppImage assets are replaced on every push; versioned releases live under the v* tags." \
              /tmp/landir-x86_64.AppImage
          fi

  # amd64 image only; the arm64 image is built by the monthly scheduled
  # workflow (arm64-monthly.yml).
  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Prefer a PAT (secret GHCR_TOKEN, scopes read:packages + write:packages):
      # the default GITHUB_TOKEN is denied (read_package) when the ghcr
      # namespace already has an unlinked package. Falls back to GITHUB_TOKEN.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # docker buildx handles ghcr's blob-existence probes correctly (podman
      # push fails with 403 on the first push to a fresh package).
      # :latest and :rolling are moving tags — each push replaces the
      # previous rolling image (old digests remain pullable by sha).
      - name: Build and push rolling image (amd64)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/landir
        run: |
          docker buildx build --platform linux/amd64 -f Containerfile \
            -t "$IMAGE:latest" -t "$IMAGE:rolling" --push .

      # Smoke test the published artifact: the advertised URL must use the
      # *mapped* port and actually serve the page.
      - name: Smoke test the pushed image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/landir
        run: |
          mkdir -p /tmp/smoke-uploads
          podman run -d --name landir-smoke -p 18080:8000 -v /tmp/smoke-uploads:/app/uploads \
            "$IMAGE:latest" --url http://127.0.0.1:18080
          sleep 2
          podman logs landir-smoke | grep -q "Open http://127.0.0.1:18080/"
          url=$(podman logs landir-smoke | grep -o 'Open http://[^ ]*' | sed 's/^Open //')
          curl -fsS "$url" | grep -q "<title>LANdir</title>"
          podman kill -s INT landir-smoke
          sleep 1
          podman ps -a --filter name=landir-smoke --format '{{.Status}}' | grep -q "Exited (0)"

      # The package was pushed with the PAT, so the visibility PATCH must use
      # the same token — GITHUB_TOKEN gets 404 on PAT-created packages.
      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          # PAT-pushed packages live under the user namespace and may not be
          # linked to the repo, so the repo-scoped endpoint can 404 — fall
          # back to the user-scoped one.
          gh api --method PATCH \
            "/repos/${{ github.repository }}/packages/container/landir/visibility" \
            -f visibility=public \
          || gh api --method PATCH \
            "/user/packages/container/landir/visibility" \
            -f visibility=public
