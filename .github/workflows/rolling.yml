# Rolling builds: on every push to slop, build the signed APK and the
# container image and publish them under fixed, replaceable names so the
# previous rolling build is superseded:
#
#   - APK: attached to the persistent "rolling" GitHub Release as
#     landir-arm64.apk (asset clobbered on each run). Obtanium pointed at
#     this repo picks it up as the latest (non-prerelease) release.
#   - Image: pushed to ghcr.io/<owner>/landir:latest and :rolling, so
#     `podman pull ghcr.io/gianfrid/landir:latest` always gets the newest
#     build.
#
# Versioned v* tags still go through release.yml (signed APK on a versioned
# release + versioned image tags); this workflow only handles the rolling
# channel. The APK build mirrors release.yml on purpose, including the
# fail-fast secrets check: a rolling build must never silently fall back to
# a debug-signed APK that users would install over the signed one.
name: Rolling

on:
  push:
    branches: [slop]
  workflow_dispatch:

permissions:
  contents: write # move the rolling tag, create/update the release
  packages: write # push the rolling image to ghcr.io

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - name: Fetch packages
        working-directory: app
        run: flutter pub get

      # Fail before building if any signing secret is missing (same rule as
      # release.yml).
      - name: Check signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for s in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!s:-}" ]; then echo "missing secret: $s" >&2; exit 1; fi
          done

      - name: Decode release keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release-key.jks
          echo "ANDROID_KEYSTORE_FILE=/tmp/release-key.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Build APK (arm64, release-signed)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: app
        run: flutter build apk --release --split-per-abi --target-platform=android-arm64

      - name: Publish rolling APK to the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          cp "$APK" /tmp/landir-arm64.apk
          # Keep the rolling release pointing at the commit being built.
          # actions/checkout persists the GITHUB_TOKEN credentials, so this
          # push is authorized by contents: write above.
          git config user.name github-actions
          git config user.email github-actions@github.com
          git tag -f rolling HEAD
          git push --force origin rolling
          if gh release view rolling >/dev/null 2>&1; then
            gh release upload rolling /tmp/landir-arm64.apk --clobber
          else
            gh release create rolling --title "Rolling build (latest)" \
              --notes "Automated rolling build of the \`slop\` branch. The APK asset is replaced on every push; versioned releases live under the v* tags." \
              /tmp/landir-arm64.apk
          fi

  # amd64 image only; the arm64 image is built by the monthly scheduled
  # workflow (arm64-monthly.yml).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # Prefer a PAT (secret GHCR_TOKEN, scopes read:packages + write:packages):
      # the default GITHUB_TOKEN is denied (read_package) when the ghcr
      # namespace already has an unlinked package. Falls back to GITHUB_TOKEN.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # docker buildx handles ghcr's blob-existence probes correctly (podman
      # push fails with 403 on the first push to a fresh package).
      # :latest and :rolling are moving tags — each push replaces the
      # previous rolling image (old digests remain pullable by sha).
      - name: Build and push rolling image (amd64)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/landir
        run: |
          docker buildx build --platform linux/amd64 -f Containerfile \
            -t "$IMAGE:latest" -t "$IMAGE:rolling" --push .

      # Smoke test the published artifact: the advertised URL must use the
      # *mapped* port and actually serve the page.
      - name: Smoke test the pushed image
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/landir
        run: |
          mkdir -p /tmp/smoke-uploads
          podman run -d --name landir-smoke -p 18080:8000 -v /tmp/smoke-uploads:/app/uploads \
            "$IMAGE:latest" --url http://127.0.0.1:18080
          sleep 2
          podman logs landir-smoke | grep -q "Open http://127.0.0.1:18080/"
          url=$(podman logs landir-smoke | grep -o 'Open http://[^ ]*' | sed 's/^Open //')
          curl -fsS "$url" | grep -q "<title>Landir</title>"
          podman kill -s INT landir-smoke
          sleep 1
          podman ps -a --filter name=landir-smoke --format '{{.Status}}' | grep -q "Exited (0)"

      # The package was pushed with the PAT, so the visibility PATCH must use
      # the same token — GITHUB_TOKEN gets 404 on PAT-created packages.
      - name: Make package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN || github.token }}
        run: |
          gh api --method PATCH \
            "/repos/${{ github.repository }}/packages/container/landir/visibility" \
            -f visibility=public
