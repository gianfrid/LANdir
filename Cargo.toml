[package]
name = "landir"
version = "0.1.0"
edition = "2021"
description = "LAN file upload server (Rust implementation, distributed as a container image)"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "multipart"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "signal", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
qrcode = "0.14"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
percent-encoding = "2"
# Sealed (encrypted) mode — the same wire protocol as the Flutter app
# (docs/design/001-qr-paired-app-encryption.md): X25519 ‖ HKDF-SHA256 ‖
# ChaCha20-Poly1305, fixed ciphersuite, envelopes 'L' ‖ …
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
# TUI when attached to a terminal (pure Rust, musl-static friendly for the
# distroless image); without a TTY the server falls back to plain log lines
ratatui = "0.30"
crossterm = "0.29"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

# The binary ships inside a distroless image; size is a first-class requirement.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
